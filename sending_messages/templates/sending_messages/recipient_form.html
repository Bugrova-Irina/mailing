{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-4">
        </div>
        <div class="col-4">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card-body">
                    {% csrf_token %}
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-lg btn-block btn-outline-primary">
                    {% if object %}
                    Сохранить
                    {% else %}
                    Создать
                    {% endif %}
                </button>
                <a class="btn btn-lg btn-block btn-outline-primary" href="{% url 'sending_messages:recipients_list' %}" role="button">Отменить</a>
            </form>
        </div>
        <div class="col-4">
        </div>
    </div>
</div>
{% endblock %}
