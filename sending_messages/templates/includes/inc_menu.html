<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Сервис рассылок</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="{% url 'sending_messages:main' %}">Главная</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'sending_messages:recipients_list' %}">Каталог клиентов</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'sending_messages:mailing_list' %}">Каталог рассылок</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'sending_messages:letters_list' %}">Каталог сообщений</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'sending_messages:attempts_list' %}">Попытки рассылки</a>
        {% if user.is_authenticated %}
        <form action="{% url 'users:logout' %}" method="post">
            {% csrf_token %}
            <button class="p-2 btn btn-outline-primary" type="submit">Выход</button>
        </form>
        {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Вход</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>
