{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 text-center">
            <h1>Профиль</h1>
        </div>
    </div>
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-4">
            <div class="card">
                <img src="{{ user.avatar.url }}">
                <div class="card-body">
                    <p class="card-text">Фамилия: {{ user.last_name }}</p>
                    <p class="card-text">Имя: {{ user.first_name }}</p>
                    <p class="card-text">E-mail: {{ user.email }}</p>
                    <p class="card-text">Телефон: {{ user.phone }}</p>
                    <p class="card-text">Страна: {{ user.country }}</p>
                    <div class="card-text text-center">
                        <a class="btn btn-primary w-100" href="{% url 'users:profile_update' user.pk %}" role="button">Редактировать</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
